function renderHero(day){const now=new Date(), md=`${now.getMonth()+1}/${now.getDate()}`;const current=DAYS[md]?md:selectedDay;const d=DAYS[current];let next=null,idx=-1;d.events.some((e,i)=>{if(!get(eventKey(current,i),false)){next=e;idx=i;return true}});$("#todayHero").innerHTML=`<div class="kicker">${DAYS[md]?"今天":"当前查看"} · ${current} · ${d.city}</div><h2>${next?`下一站 ${next[0]} · ${next[1]}`:"当天行程已全部完成"}</h2><p>${next?next[2]:"可以切换其他日期继续查看。"}</p>${next?`<div class="hero-actions"><a class="btn" href="${maps(next[3])}" target="_blank">开始导航</a><button class="btn" id="heroDone">标记完成</button></div>`:""}`;const hd=$("#heroDone");if(hd)hd.onclick=()=>{set(eventKey(current,idx),true);selectedDay=current;set("selectedDay",current);renderDays()}}
function renderTravel(){const cards=[{t:"10/3 · AK719",a:"KUL T2",b:"SIN T4",x:"18:50",y:"20:00",n:"吉隆坡 → 新加坡"},{t:"10/6 · CZ5086",a:"SIN T1",b:"SZX T3",x:"05:10",y:"09:35",n:"新加坡 → 深圳"},{t:"10/6 · CZ3551",a:"SZX T3",b:"SHA T2",x:"12:00",y:"14:25",n:"深圳 → 上海虹桥"}];$("#travelCards").innerHTML=cards.map(c=>`<div class="card"><h4>${c.t}</h4><div class="flight"><div class="airport"><b>${c.x}</b><span>${c.a}</span></div><div class="arrow">→</div><div class="airport"><b>${c.y}</b><span>${c.b}</span></div></div><p>${c.n}</p></div>`).join("")+`<div class="card"><h4>Traders Hotel Kuala Lumpur</h4><p>10/2–10/3 · KLCC。Twin Towers View 房型。</p><div class="actions"><a class="btn" href="${maps("Traders Hotel Kuala Lumpur")}" target="_blank">地图</a></div></div><div class="card"><h4>Venue Hotel</h4><p>10/3–10/5。当前尚未确认具体分店地址，最终版需要用订单地址锁定。</p><div class="actions"><a class="btn" href="${maps("Venue Hotel Singapore")}" target="_blank">名称搜索</a></div></div>`}
function renderFood(){let n=0;$("#foodList").innerHTML=FOOD.map((f,i)=>{const v=get(`food:${i}`,false);if(v)n++;return `<div class="card"><h4>${f[1]} <span class="badge ${v?"ok":""}">${v?"已吃":"待打卡"}</span></h4><p>${f[0]} · ${f[2]}</p><div class="actions"><a class="btn" href="${maps(f[3])}" target="_blank">地图</a><button class="btn state ${v?"done":""}" data-food="${i}">${v?"✓ 已吃":"标记已吃"}</button></div></div>`}).join("");$("#foodProgress").textContent=`${n}/${FOOD.length} 已打卡`;$$("[data-food]").forEach(b=>b.onclick=()=>{const k=`food:${b.dataset.food}`;set(k,!get(k,false));renderFood()})}
function renderChecks(){$("#bookingList").innerHTML=BOOKINGS.map((b,i)=>{const v=get(`book:${i}`,false);return `<div class="checkrow"><input type="checkbox" id="b${i}" ${v?"checked":""}><label for="b${i}"><b>${b[0]}</b> <span class="badge ${v?"ok":"warn"}">${v?"已完成":"待处理"}</span><div class="small">${b[1]}</div><div class="actions"><a class="btn" href="${b[2]}" target="_blank">打开官网</a></div></label></div>`}).join("");BOOKINGS.forEach((_,i)=>$(`#b${i}`).onchange=e=>set(`book:${i}`,e.target.checked));$("#exitList").innerHTML=EXIT.map((x,i)=>{const v=get(`exit:${i}`,false);return `<div class="checkrow"><input type="checkbox" id="x${i}" ${v?"checked":""}><label for="x${i}">${x}</label></div>`}).join("");EXIT.forEach((_,i)=>$(`#x${i}`).onchange=e=>set(`exit:${i}`,e.target.checked))}
$$('.tabbtn').forEach(b=>b.onclick=()=>{$$('.tabbtn').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.toggle('active',v.dataset.view===b.dataset.tab));window.scrollTo({top:0,behavior:'smooth'})});
renderDays();renderTravel();renderFood();renderChecks();if(window.matchMedia('(display-mode: standalone)').matches)$('#installTip').style.display='none';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
